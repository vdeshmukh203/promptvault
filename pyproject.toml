[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptvault"
version = "0.2.0"
description = "Versioned prompt template storage with history tracking"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
promptvault = "promptvault.gui:run"

[tool.hatch.build.targets.wheel]
packages = ["src/promptvault"]
