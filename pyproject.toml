[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptvault"
version = "0.1.0"
description = "Versioned prompt template storage with history tracking"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[tool.hatch.build.targets.wheel]
packages = ["src/promptvault"]
